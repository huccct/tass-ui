name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 部署 action 要往 gh-pages 分支写提交，默认的 token 只有读权限
permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 要读每个文件的 git 提交时间，默认的浅克隆拿不到
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs
        # config.ts 里 base 靠 NODE_ENV 判断，不设的话会构建出 base: '' 的错误产物
        env:
          NODE_ENV: production
        run: pnpm run docs:build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/.vitepress/dist
